<title>Dragon Toolkit | أدوات العملات الرقمية</title>
<style>
/* ==================== RPG COLOR SYSTEM ==================== */
:root {
  --navy-900: #070b1d;
  --navy-800: #0d132b;
  --navy-700: #111a3d;
  --navy-600: #1a2347;
  
  --blue-core: #2563eb;
  --blue-glow: #3b82f6;
  --blue-light: #60a5fa;
  --purple-glow: #8b5cf6;
  --cyan-glow: #22d3ee;
  --gold: #f59e0b;
  --gold-light: #fbbf24;
  --success: #10b981;
  --danger: #f43f5e;
  
  --gradient-primary: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #8b5cf6 100%);
  --gradient-gold: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #fcd34d 100%);
  --gradient-cyan: linear-gradient(135deg, #22d3ee, #3b82f6);
  --gradient-glow: linear-gradient(135deg, rgba(37,99,235,0.15) 0%, rgba(139,92,246,0.12) 100%);
  --gradient-shimmer: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  
  --glass-bg: rgba(16, 22, 48, 0.6);
  --glass-border: rgba(96, 165, 250, 0.08);
  --glass-border-hover: rgba(96, 165, 250, 0.2);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.03);
  --glass-shadow-hover: 0 20px 40px rgba(0,0,0,0.4), 0 0 30px rgba(59,130,246,0.1);
  
  --text-glow-blue: 0 0 20px rgba(59,130,246,0.5);
  --text-glow-gold: 0 0 20px rgba(245,158,11,0.4);
  --box-glow-blue: 0 0 20px rgba(37,99,235,0.4), 0 0 40px rgba(59,130,246,0.2);
  --box-glow-purple: 0 0 20px rgba(139,92,246,0.3);

  --bg-primary: #070b1d;
  --bg-secondary: #0d132b;
  --bg-card: rgba(16, 22, 48, 0.6);
  --bg-glass: rgba(59, 130, 246, 0.04);
  --border-glass: rgba(96, 165, 250, 0.08);
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent-blue: #3b82f6;
  --accent-purple: #8b5cf6;
  --accent-cyan: #22d3ee;
  --accent-green: #10b981;
  --accent-red: #f43f5e;
  --accent-orange: #f59e0b;
  --accent-pink: #ec4899;
  --shadow-card: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.03);
  --radius: 20px;
  --radius-sm: 8px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Tahoma, Arial, sans-serif;
}

/* ==================== LIGHT MODE ==================== */
[data-theme="light"] {
  --bg-primary: #f0f4f8;
  --bg-secondary: #ffffff;
  --bg-card: rgba(255, 255, 255, 0.92);
  --bg-glass: rgba(37, 99, 235, 0.04);
  --border-glass: rgba(30, 64, 175, 0.08);
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --shadow-card: 0 8px 32px rgba(30, 58, 138, 0.1), 0 0 0 1px rgba(96, 165, 250, 0.12);
  --glass-bg: rgba(255, 255, 255, 0.85);
  --glass-border: rgba(30, 64, 175, 0.08);
  --glass-shadow: 0 8px 32px rgba(30, 58, 138, 0.08);
  --glass-shadow-hover: 0 20px 40px rgba(30, 58, 138, 0.15), 0 0 30px rgba(59,130,246,0.05);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-main);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  transition: var(--transition);
}

/* ==================== ANIMATED BACKGROUND ==================== */
.rpg-bg-orb {
  position: fixed;
  border-radius: 50%;
  opacity: 0.25;
  pointer-events: none;
  z-index: 0;
}
.orb-1 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, var(--blue-glow) 0%, transparent 70%);
  top: -10%; left: -10%;
  animation: orbFloat 20s ease-in-out infinite;
}
.orb-2 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, var(--purple-glow) 0%, transparent 70%);
  bottom: -10%; right: -10%;
  animation: orbFloat 20s ease-in-out infinite reverse;
}
.orb-3 {
  width: 300px; height: 300px;
  background: radial-gradient(circle, var(--cyan-glow) 0%, transparent 70%);
  top: 40%; left: 50%;
  animation: orbFloat 15s ease-in-out infinite 5s;
}
@keyframes orbFloat {
  0%, 100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(30px,-30px) scale(1.1); }
  66% { transform: translate(-20px,20px) scale(0.95); }
}

.rpg-grid-overlay {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image: 
    linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
  background-size: 50px 50px;
}

.bg-animated {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: -2; pointer-events: none; overflow: hidden;
}
#particles-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 2; pointer-events: none;
}

/* ==================== GLASSMORPHISM PANELS ==================== */
.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: blur(8px) saturate(150%);
  -webkit-backdrop-filter: blur(8px) saturate(150%);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  box-shadow: var(--glass-shadow);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.glass-panel:hover {
  border-color: var(--glass-border-hover);
  box-shadow: var(--glass-shadow-hover);
}

/* ==================== GRADIENT TEXT EFFECTS ==================== */
.gradient-text {
  background: linear-gradient(135deg, #3b82f6, #8b5cf6, #22d3ee);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: hueRotate 8s linear infinite;
}
.gradient-text-gold {
  background: var(--gradient-gold);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
@keyframes hueRotate {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

/* ==================== GLOW EFFECTS ==================== */
.glow-blue { box-shadow: 0 0 20px rgba(37,99,235,0.4), 0 0 40px rgba(59,130,246,0.2); }
.glow-purple { box-shadow: 0 0 20px rgba(139,92,246,0.3); }
.glow-gold { box-shadow: 0 0 20px rgba(245,158,11,0.4); }
.text-glow-blue { text-shadow: 0 0 20px rgba(59,130,246,0.5); }

/* ==================== SHIMMER ==================== */
.shimmer {
  background: linear-gradient(90deg, #2563eb, #3b82f6, #60a5fa, #8b5cf6);
  background-size: 200% 100%;
  animation: shimmerMove 2s linear infinite;
}
@keyframes shimmerMove {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ==================== PULSE GLOW ==================== */
.pulse-glow {
  animation: pulseGlow 2s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%, 100% { opacity: 0.4; transform: scale(1); box-shadow: 0 0 20px rgba(37,99,235,0.3); }
  50% { opacity: 0.8; transform: scale(1.05); box-shadow: 0 0 40px rgba(37,99,235,0.6); }
}

/* ==================== SCROLLBAR ==================== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--navy-900); }
::-webkit-scrollbar-thumb { background: var(--gradient-primary); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--gradient-cyan); }

/* ==================== APP ==================== */
#app { display: block; min-height: 100vh; }
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(7,11,29,0.8);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--glass-border);
  padding: 16px 24px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
}
[data-theme="light"] .header { background: rgba(240,244,248,0.85); }
.header-brand {
  display: flex; align-items: center; gap: 12px;
}
.header-brand .logo-box {
  width: 40px; height: 40px;
  background: var(--gradient-primary);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; color: white; font-size: 18px;
}
.header-brand span {
  font-size: 20px; font-weight: 800;
  background: var(--gradient-primary);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header-actions {
  display: flex; align-items: center; gap: 10px;
}
.icon-btn {
  width: 38px; height: 38px;
  background: var(--bg-glass);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-secondary);
  transition: var(--transition);
}
.icon-btn:hover {
  background: var(--glass-bg);
  color: var(--text-primary);
  border-color: var(--blue-core);
}
.icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
.main-content {
  padding: 24px;
  min-height: calc(100vh - 72px);
}
.tool-page {
  background: var(--glass-bg);
  backdrop-filter: blur(6px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 32px;
  max-width: 800px; margin: 0 auto;
}
.tool-page-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 28px;
}
.tool-page-header h2 { font-size: 22px; font-weight: 800; }
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block; font-size: 13px; font-weight: 600;
  color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 14px 16px;
  background: var(--bg-glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  color: var(--text-primary); font-size: 15px;
  font-family: var(--font-main); outline: none;
  transition: var(--transition);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--blue-core);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}
.form-group textarea { min-height: 120px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media(max-width:640px) { .form-row { grid-template-columns: 1fr; } }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 28px;
  background: var(--gradient-primary);
  border: none; border-radius: var(--radius-sm);
  color: white; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: var(--transition);
  position: relative; overflow: hidden;
}
.btn::after {
  content: ''; position: absolute; inset: 0;
  background: var(--gradient-shimmer);
  transform: translateX(-100%);
  transition: 0.7s;
}
.btn:hover::after { transform: translateX(100%); }
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4), 0 0 20px rgba(59, 130, 246, 0.15);
}
.btn-secondary {
  background: var(--bg-glass); color: var(--text-primary);
  border: 1px solid var(--glass-border);
}
.btn-secondary:hover { background: var(--glass-bg); }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
.result-box {
  margin-top: 20px; padding: 20px;
  background: var(--gradient-glow);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
}
.result-box .result-label {
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
}
.result-box .result-value {
  font-size: 28px; font-weight: 800;
  background: var(--gradient-primary);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.result-box .result-sub {
  font-size: 14px; color: var(--text-secondary); margin-top: 4px;
}
.toast-container {
  position: fixed; bottom: 24px; right: 24px; z-index: 9998;
  display: flex; flex-direction: column; gap: 10px;
}
.toast {
  background: var(--glass-bg);
  backdrop-filter: blur(8px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  padding: 14px 20px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: var(--glass-shadow);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  min-width: 280px;
  border-right: 3px solid var(--blue-glow);
}
.toast.success { border-right-color: var(--success); }
.toast.error { border-right-color: var(--danger); }
.toast.info { border-right-color: var(--blue-glow); }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }
.palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.palette-swatch {
  border-radius: var(--radius-sm); overflow: hidden;
  border: 1px solid var(--glass-border); cursor: pointer;
  transition: var(--transition);
}
.palette-swatch:hover { transform: scale(1.05); }
.palette-color { height: 80px; }
.palette-info { padding: 10px; font-size: 12px; font-weight: 600; background: var(--bg-secondary); }
.seed-warning {
  background: rgba(244,63,94,0.1);
  border: 1px solid rgba(244,63,94,0.3);
  border-radius: var(--radius-sm);
  padding: 16px;
  color: var(--danger);
  font-size: 14px; font-weight: 600;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
@media(max-width:640px) {
  .tool-page { padding: 20px; }
}
[dir="rtl"] .toast-container { right: auto; left: 24px; }

.dragon-box { text-align: center; padding: 4px; }
.dragon-logo { width: 90px; height: 90px; margin: 0 auto 18px; }
.dragon-logo svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px var(--blue-glow)); }

/* ==================== DRAGON BUTTON STYLE ==================== */
.dragon-btn {
  width: 100%;
  padding: 18px 28px;
  background: #0a0a1a;
  border: 2px solid #1a2a6a;
  border-radius: var(--radius-sm);
  color: #7eb8ff;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  text-shadow: 0 0 10px rgba(59,130,246,0.3);
  box-shadow: 
    0 0 20px rgba(37,99,235,0.15),
    inset 0 0 30px rgba(37,99,235,0.05);
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(59,130,246,0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(59,130,246,0.05) 0%, transparent 40%),
    repeating-linear-gradient(
      45deg,
      transparent 0px,
      transparent 4px,
      rgba(37,99,235,0.03) 4px,
      rgba(37,99,235,0.03) 5px
    );
  letter-spacing: 2px;
}
.dragon-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(circle at 30% 20%, rgba(59,130,246,0.15) 0%, transparent 60%),
    radial-gradient(circle at 70% 80%, rgba(59,130,246,0.1) 0%, transparent 50%);
  pointer-events: none;
}
.dragon-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--gradient-shimmer);
  transform: translateX(-100%);
  transition: 0.7s;
}
.dragon-btn:hover {
  transform: translateY(-3px) scale(1.01);
  border-color: #3b82f6;
  box-shadow: 
    0 8px 32px rgba(37,99,235,0.4),
    0 0 40px rgba(37,99,235,0.15),
    inset 0 0 40px rgba(37,99,235,0.08);
  color: #93c5fd;
}
.dragon-btn:hover::after { transform: translateX(100%); }
.dragon-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

/* ==================== DRAGON REWARD INPUT ==================== */
.dragon-reward-input {
  width: 100%;
  padding: 14px 16px;
  background: #1a0e00;
  border: 2px solid #f59e0b;
  border-radius: var(--radius-sm);
  color: #fbbf24;
  font-size: 15px;
  font-family: var(--font-main);
  outline: none;
  transition: var(--transition);
  text-align: center;
  letter-spacing: 2px;
  font-weight: 700;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(245,158,11,0.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(245,158,11,0.08) 0%, transparent 40%),
    repeating-linear-gradient(
      45deg,
      transparent 0px,
      transparent 4px,
      rgba(245,158,11,0.04) 4px,
      rgba(245,158,11,0.04) 5px
    );
  box-shadow: 0 0 20px rgba(245,158,11,0.1);
}
.dragon-reward-input:focus {
  border-color: #fbbf24;
  box-shadow: 0 0 30px rgba(245,158,11,0.2), inset 0 0 20px rgba(245,158,11,0.05);
}
.dragon-reward-input::placeholder {
  color: rgba(245,158,11,0.4);
  letter-spacing: 2px;
}
.dragon-reward-input:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.dragon-reward-btn {
  width: 100%;
  padding: 16px 28px;
  background: #0a0a1a;
  border: 2px solid #1a2a6a;

/* ==================== COUNTDOWN WIDGET - CENTERED ==================== */
.countdown-widget {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: 72px;
  height: 72px;
  z-index: 500;
}
.countdown-widget svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.countdown-widget .cd-counter {
  position: absolute;
  top: -24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--glass-bg);
  backdrop-filter: blur(6px);
  border: 1px solid var(--glass-border);
  border-radius: 100px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-primary);
  white-space: nowrap;
  box-shadow: var(--glass-shadow);
}
.countdown-widget .cd-bg { fill: none; stroke: var(--glass-border); stroke-width: 5; }
.countdown-widget .cd-progress {
  fill: none;
  stroke: #3b82f6;
  stroke-width: 5;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s linear;
}
.countdown-widget .cd-inner {
  position: absolute;
  inset: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--glass-bg);
  backdrop-filter: blur(6px);
  border-radius: 50%;
  border: 1px solid var(--glass-border);
  font-weight: 800;
  font-size: 22px;
  color: var(--text-primary);
  box-shadow: var(--glass-shadow);
  transition: var(--transition);
}
.countdown-widget.ready .cd-inner {
  cursor: pointer;
  font-size: 11px;
  line-height: 1.2;
  text-align: center;

(function() {
  const canvas = document.getElementById('particles-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let particles = [];
  let w, h;
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  for (let i = 0; i < 25; i++) {
    particles.push({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 2 + 0.5,
      dx: (Math.random() - 0.5) * 0.3,
      dy: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.5 + 0.1
    });
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0 || p.x > w) p.dx *= -1;
      if (p.y < 0 || p.y > h) p.dy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(59,130,246,' + p.alpha + ')';
      ctx.fill();
    });
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = 'rgba(59,130,246,' + (0.08 * (1 - dist/120)) + ')';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

  if (!widget) return;
  var circle = widget.querySelector('.cd-progress');
  var inner = widget.querySelector('.cd-inner');
  var circumference = 2 * Math.PI * 30;
  circle.style.strokeDasharray = circumference;
  circle.style.strokeDashoffset = 0;
  widget.classList.remove('ready');
  inner.onclick = null;
  var remaining = 5;
  inner.textContent = remaining;
  countdownTimer = setInterval(function() {
    remaining--;
    circle.style.strokeDashoffset = circumference * (1 - remaining / 5);
    if (remaining <= 0) {
      clearInterval(countdownTimer);
      widget.classList.add('ready');
      inner.textContent = 'اضغط هنا';
      inner.onclick = goToNextTool;
    } else {
      inner.textContent = remaining;
    }
  }, 1000);
}

function waitForAdsAndStartCountdown() {
  var started = false;
  var fallbackTimer = setTimeout(function() {
    if (!started) { started = true; startCountdown(); }
  }, 8000);

  var checkInterval = setInterval(function() {
    if (dragonAdsReady && !started) {
      started = true;
      clearTimeout(fallbackTimer);
      clearInterval(checkInterval);
      startCountdown();
    }
  }, 150);
}

function goToNextTool() {
  if (currentToolIndex === 19) {
    currentToolIndex = 20;
    openTool(toolOrder[20]);
    var widget = document.getElementById('countdownWidget');
    if (widget) widget.style.display = 'none';
    return;
  }
  
  if (currentToolIndex === 20) {
    var widget = document.getElementById('countdownWidget');
    if (widget) widget.style.display = 'none';
    return;
  }
  
  currentToolIndex = (currentToolIndex + 1) % 20;
  openTool(toolOrder[currentToolIndex]);
}

function openTool(id) {
  var idx = toolOrder.indexOf(id);
  if (idx !== -1) currentToolIndex = idx;
  const container = document.getElementById('toolPagesContainer');

  // أعد الإعلانات الثابتة لمكانها الأصلي قبل استبدال محتوى الـ container
  var staticAd = document.getElementById('staticAdFrame');
  var adbitsAd = document.getElementById('adbitsAdFrame');
  
  if (staticAd) {
    document.body.insertBefore(staticAd, document.getElementById('app'));
    staticAd.style.display = 'none';
  }
  if (adbitsAd) {
    document.body.insertBefore(adbitsAd, document.getElementById('app'));
    adbitsAd.style.display = 'none';
  }

  container.innerHTML = toolPagesHTML[id] || '';
  container.style.display = 'block';
  window.scrollTo(0,0);
  if (id === 'converter') fetchCryptoPrices();
  injectCountdownWidget();

  if (id === 'profit_calc') {
    var wrapper = document.getElementById('profitAdWrapper');
    if (wrapper) {
      // إضافة كلا الإعلانين
      if (adbitsAd) {
        adbitsAd.style.display = 'block';
        wrapper.appendChild(adbitsAd);
      }
      if (staticAd) {
        staticAd.style.display = 'block';
        wrapper.appendChild(staticAd);
      }
    }
    waitForAdsAndStartCountdown();
  } else {
    startCountdown();
  }

  if (id === 'dragon_login') {
      setTimeout(initDragonScreen, 100);
  }
}

function calcProfit() {
  var buy = parseFloat(document.getElementById('pc_buy').value) || 0;
  var sell = parseFloat(document.getElementById('pc_sell').value) || 0;
  var amt = parseFloat(document.getElementById('pc_amount').value) || 0;
  var fee = parseFloat(document.getElementById('pc_fee').value) || 0;
  var gross = (sell - buy) * amt;
  var feeAmt = (buy * amt + sell * amt) * (fee / 100);
  var net = gross - feeAmt;

function convertCrypto() {
  var from = document.getElementById('cv_from').value;
  var to = document.getElementById('cv_to').value;
  var amt = parseFloat(document.getElementById('cv_amount').value) || 0;
  if (!cryptoPrices[from]) { toast('الأسعار لم تُحمّل بعد. حاول مرة أخرى.', 'error'); return; }
  var result = 0;
  if (to === 'usd') result = amt * cryptoPrices[from].usd;
  else if (to === 'btc') result = amt * (cryptoPrices[from].btc || cryptoPrices[from].usd / cryptoPrices.btc.usd);
  else if (to === 'eth') result = amt * (cryptoPrices[from].eth || cryptoPrices[from].usd / cryptoPrices.eth.usd);
  else result = amt * (cryptoPrices[from].usd / cryptoPrices[to].usd);
  document.getElementById('cv_result').innerHTML = '<div class="result-box"><div class="result-label">المبلغ المحول</div><div class="result-value">' + result.toFixed(6) + ' ' + to.toUpperCase() + '</div><div class="result-sub">1 ' + from.toUpperCase() + ' = ' + (cryptoPrices[from].usd / (to==='usd'?1:cryptoPrices[to].usd)).toFixed(6) + ' ' + to.toUpperCase() + '</div></div>';
}

function convertUnit() {
  var from = document.getElementById('uc_from').value;
  var to = document.getElementById('uc_to').value;
  var val = parseFloat(document.getElementById('uc_val').value) || 0;
  var ethUnits = { wei: 1, gwei: 1e9, ether: 1e18 };
  var btcUnits = { satoshi: 1, bits: 100, mbtc: 1e5, btc: 1e8 };
  var wei = 0, sat = 0;
  if (ethUnits[from]) wei = val * ethUnits[from];
  else sat = val * btcUnits[from];
  var result = 0;
  if (ethUnits[to]) result = wei / ethUnits[to];
  else if (btcUnits[to]) result = sat / btcUnits[to];
  document.getElementById('uc_result').innerHTML = '<div class="result-box"><div class="result-label">القيمة المحولة</div><div class="result-value">' + result.toLocaleString(undefined, {maximumFractionDigits: 18}) + '</div><div class="result-sub">' + from + ' → ' + to + '</div></div>';
}

  var limit = gasLimits[type];
  var feeEth = (limit * gwei) / 1e9;
  document.getElementById('ge_result').innerHTML = '<div class="result-box"><div class="result-label">رسوم الغاز المقدرة</div><div class="result-value">' + feeEth.toFixed(6) + ' ETH</div><div class="result-sub">حد الغاز: ' + limit.toLocaleString() + ' | سعر الغاز: ' + gwei + ' Gwei</div></div>';
}

function calcPct() {
  var val = parseFloat(document.getElementById('pc_val').value) || 0;
  var pct = parseFloat(document.getElementById('pc_pct').value) || 0;
  var result = val * (pct / 100);
  document.getElementById('pct_result').innerHTML = '<div class="result-box"><div class="result-label">النتيجة</div><div class="result-value">' + result.toFixed(4) + '</div><div class="result-sub">' + pct + '% من ' + val + ' = ' + result.toFixed(4) + '</div></div>';
}
function calcIncrease() {
  var val = parseFloat(document.getElementById('pc_val').value) || 0;
  var pct = parseFloat(document.getElementById('pc_pct').value) || 0;
  var result = val * (1 + pct / 100);
  document.getElementById('pct_result').innerHTML = '<div class="result-box"><div class="result-label">القيمة بعد الزيادة</div><div class="result-value">' + result.toFixed(4) + '</div><div class="result-sub">' + val + ' زيادة بنسبة ' + pct + '% = ' + result.toFixed(4) + '</div></div>';
}
function calcDecrease() {
  var val = parseFloat(document.getElementById('pc_val').value) || 0;
  var pct = parseFloat(document.getElementById('pc_pct').value) || 0;
  var result = val * (1 - pct / 100);
  document.getElementById('pct_result').innerHTML = '<div class="result-box"><div class="result-label">القيمة بعد النقصان</div><div class="result-value">' + result.toFixed(4) + '</div><div class="result-sub">' + val + ' نقصان بنسبة ' + pct + '% = ' + result.toFixed(4) + '</div></div>';
}

function calcROI() {
  var invest = parseFloat(document.getElementById('roi_invest').value) || 0;
  var final = parseFloat(document.getElementById('roi_final').value) || 0;
  var roi = invest > 0 ? ((final - invest) / invest) * 100 : 0;
  document.getElementById('roi_result').innerHTML = '<div class="result-box"><div class="result-label">العائد على الاستثمار</div><div class="result-value">' + roi.toFixed(2) + '%</div><div class="result-sub">الربح: $' + (final - invest).toFixed(2) + '</div></div>';
}

function calcCompound() {
  var p = parseFloat(document.getElementById('ci_principal').value) || 0;
  var r = parseFloat(document.getElementById('ci_rate').value) || 0;
  var t = parseFloat(document.getElementById('ci_years').value) || 0;
  var n = parseInt(document.getElementById('ci_freq').value);
  var amount = p * Math.pow(1 + (r / 100) / n, n * t);
  document.getElementById('ci_result').innerHTML = '<div class="result-box"><div class="result-label">المبلغ النهائي</div><div class="result-value">$' + amount.toFixed(2) + '</div><div class="result-sub">إجمالي الفائدة: $' + (amount - p).toFixed(2) + '</div></div>';
}

function calcPosition() {
  var balance = parseFloat(document.getElementById('pos_balance').value) || 0;
  var risk = parseFloat(document.getElementById('pos_risk').value) || 0;
  var entry = parseFloat(document.getElementById('pos_entry').value) || 0;
  var stop = parseFloat(document.getElementById('pos_stop').value) || 0;
  var riskAmount = balance * (risk / 100);
  var riskPerUnit = Math.abs(entry - stop);
  var size = riskPerUnit > 0 ? riskAmount / riskPerUnit : 0;
  var total = size * entry;
  document.getElementById('pos_result').innerHTML = '<div class="result-box"><div class="result-label">حجم المركز</div><div class="result-value">' + size.toFixed(6) + ' وحدة</div><div class="result-sub">الإجمالي: $' + total.toFixed(2) + ' | المخاطرة: $' + riskAmount.toFixed(2) + '</div></div>';
}

function calcRR() {
  var entry = parseFloat(document.getElementById('rr_entry').value) || 0;
  var stop = parseFloat(document.getElementById('rr_stop').value) || 0;
  var tp = parseFloat(document.getElementById('rr_tp').value) || 0;
  var risk = Math.abs(entry - stop);
  var reward = Math.abs(tp - entry);
  var ratio = risk > 0 ? (reward / risk) : 0;
  document.getElementById('rr_result').innerHTML = '<div class="result-box"><div class="result-label">نسبة المخاطرة / المكافأة</div><div class="result-value">1 : ' + ratio.toFixed(2) + '</div><div class="result-sub">المخاطرة: $' + risk.toFixed(2) + ' | المكافأة: $' + reward.toFixed(2) + '</div></div>';
}

function genPalette() {
  var grid = document.getElementById('pal_grid');
  grid.innerHTML = '';
  for (var i = 0; i < 8; i++) {
    var r = Math.floor(Math.random() * 256);
    var g = Math.floor(Math.random() * 256);
    var b = Math.floor(Math.random() * 256);
    var hex = '#' + [r, g, b].map(function(x) { return x.toString(16).padStart(2, '0'); }).join('');
    var swatch = document.createElement('div');
    swatch.className = 'palette-swatch';
    swatch.innerHTML = '<div class="palette-color" style="background:' + hex + ';"></div><div class="palette-info">' + hex + '</div>';
    swatch.onclick = function(h) { return function() { copyToClipboard(h); }; }(hex);
    grid.appendChild(swatch);
  }
}

// ==================== DRAGON SESSION SYSTEM ====================
const DRAGON_KEYS = {
    SESSION     : "dragon_session",
    FINGERPRINT : "dragon_fingerprint_id",
    DATE        : "dragon_date"
};

let dragonFpPromise = null;
let dragonFpId = null;

function initDragonFingerprint() {
    if (dragonFpPromise) return dragonFpPromise;
    dragonFpPromise = new Promise(function(resolve) {
        loadFingerprintLibrary(function() {
            FingerprintJS.load()
                .then(fp => fp.get())
                .then(result => {
                    dragonFpId = result.visitorId;
                    sessionStorage.setItem(DRAGON_KEYS.FINGERPRINT, dragonFpId);
                    resolve(dragonFpId);
                })
                .catch(() => resolve(null));
        });
    });
    return dragonFpPromise;
}

function generateDragonToken() {
    return `${Math.random().toString(36).substring(2, 12)}-${Date.now().toString(36)}-${Math.random().toString(36).substring(2, 8)}`.toUpperCase();
}

function getDragonDateTime() {
    const n = new Date();
    return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}T${String(n.getHours()).padStart(2,'0')}-${String(n.getMinutes()).padStart(2,'0')}-${String(n.getSeconds()).padStart(2,'0')}`;
}

async function storeDragonSession(sessionValue, fingerprintId, createdAt) {
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/session_data`, {
            method  : "POST",
            headers : {
                "apikey"        : SUPABASE_ANON_KEY,
                "Authorization" : `Bearer ${SUPABASE_ANON_KEY}`,
                "Content-Type"  : "application/json",
                "Prefer"        : "return=minimal"
            },
            body: JSON.stringify({ session_value: sessionValue, device_fingerprint: fingerprintId, created_at: createdAt })
        });
        return res.ok;
    } catch (err) {
        console.error("Supabase error:", err);
        return false;
    }
}

function displayDragonDeviceInfo() {
    const box = document.getElementById("dragonDeviceInfo");
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const tgId = sessionStorage.getItem("telegram_user_id") || "غير محدد";
    if (box) {
        box.innerHTML = `المنطقة: ${timezone} | اللغة: ${navigator.language}<br>معرف التليجرام: <span style="color:var(--blue-glow);font-weight:700;">${tgId}</span>`;
    }
}

async function generateDragonSession() {
    const btn = document.getElementById("dragonGenBtn");
    const loginBox = document.getElementById("dragonLoginBox");
    const rewardBox = document.getElementById("dragonRewardBox");
    const statusBox = document.getElementById("dragonRewardStatus");

    sessionStorage.removeItem(DRAGON_KEYS.SESSION);
    sessionStorage.removeItem(DRAGON_KEYS.FINGERPRINT);
    sessionStorage.removeItem(DRAGON_KEYS.DATE);
    sessionStorage.removeItem("dragon_reward_used");

    if (btn) { 
        btn.disabled = true; 
        btn.textContent = "يتم الدخول الان✨"; 
        btn.style.opacity = "0.8";
    }
    
    if (statusBox) { 
        statusBox.textContent = "جاري إنشاء الجلسة... ⏳"; 
        statusBox.style.color = "var(--blue-glow)";
    }

    try {
        const fingerprint = await initDragonFingerprint();
        if (!fingerprint) throw new Error("فشل البصمة");

        await new Promise(r => setTimeout(r, 200));

        const newSession = generateDragonToken();
        const createdAt = new Date().toISOString();

        await storeDragonSession(newSession, fingerprint, createdAt);

        sessionStorage.setItem(DRAGON_KEYS.SESSION, newSession);
        sessionStorage.setItem(DRAGON_KEYS.DATE, getDragonDateTime());

        if (loginBox) loginBox.style.display = "none";
        if (rewardBox) {
            rewardBox.style.display = "block";
            const input = document.getElementById("dragonRewardInput");
            if (input) {
                input.disabled = false;
                input.value = "";
                if (input.parentElement) input.parentElement.style.display = "block";
            }
            const rewardBtn = document.getElementById("dragonRewardBtn");
            if (rewardBtn) {
                rewardBtn.disabled = false;
                rewardBtn.style.opacity = "1";
                rewardBtn.textContent = "تحقق واحصل على المكافأة";
            }
        }
        displayDragonDeviceInfo();
        toast("تم إنشاء الجلسة بنجاح", "success");

    } catch (err) {
        console.error(err);
        toast("حدث خطأ أثناء إنشاء الجلسة", "error");
        
        if (btn) { 
            btn.disabled = false; 
            btn.textContent = "🔹الدخول🔹"; 
            btn.style.opacity = "1";
        }
        if (statusBox) { 
            statusBox.textContent = "حدث خطأ، حاول مرة أخرى"; 
            statusBox.style.color = "var(--danger)";
        }
    }
}

function initDragonScreen() {
    const loginBox = document.getElementById("dragonLoginBox");
    const rewardBox = document.getElementById("dragonRewardBox");
    const genBtn = document.getElementById("dragonGenBtn");
    const statusBox = document.getElementById("dragonRewardStatus");

    if (!loginBox || !rewardBox || !genBtn) {
        setTimeout(initDragonScreen, 500);
        return;
    }

    loginBox.style.display = "block";
    rewardBox.style.display = "none";

    genBtn.style.display = "block";
    genBtn.disabled = false;
    genBtn.style.opacity = "1";
    genBtn.textContent = "🔹الدخول🔹";

    if (statusBox) { 
        statusBox.textContent = ""; 
    }
}

async function verifyDragonReward() {
    const token = document.getElementById("dragonRewardInput")?.value.trim().toUpperCase();
    const input = document.getElementById("dragonRewardInput");
    const statusBox = document.getElementById("dragonRewardStatus2");
    const rewardBtn = document.getElementById("dragonRewardBtn");

    if (!token) { toast("يرجى إدخال الكود أولاً", "error"); return; }
    if (input && input.disabled) { toast("تم استخدام الكود مسبقاً", "error"); return; }
    if (sessionStorage.getItem("dragon_reward_used")) { toast("تم استخدام الكود مسبقاً", "error"); return; }

    if (rewardBtn) { rewardBtn.disabled = true; rewardBtn.style.opacity = "0.6"; rewardBtn.textContent = "جاري التحقق..."; }
    if (input) input.disabled = true;
    if (statusBox) statusBox.textContent = "جاري التحقق...";

    try {
        const currentSlug = window.location.hash.replace("#", "").toLowerCase();
        const checkRes = await fetch(
            `${SUPABASE_URL}/rest/v1/token_id?token=eq.${encodeURIComponent(token)}&page_slug=eq.${currentSlug}&select=id,token,telegram_user_id,page_slug`,
            { headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` } }
        );
        const rows = await checkRes.json();

        if (!rows || rows.length === 0) {
            toast("الكود غير صحيح أو غير مخصص لهذه الصفحة", "error");
            if (statusBox) statusBox.textContent = "الكود غير صحيح";
            if (input) input.disabled = false;
            if (rewardBtn) { rewardBtn.disabled = false; rewardBtn.style.opacity = "1"; rewardBtn.textContent = "تحقق واحصل على المكافأة"; }
            return;
        }

        const rowId = rows[0].id;
        const telegramId = rows[0].telegram_user_id;

        const tgDisplay = document.querySelector("#dragonDeviceInfo span");
        if (tgDisplay) tgDisplay.textContent = telegramId;

        const [, rewardRes] = await Promise.all([
            fetch(`${SUPABASE_URL}/rest/v1/token_id?id=eq.${rowId}`, {
                method: "DELETE",
                headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
            }),
            fetch("https://czbsrhxqoxcxjtigjnwl.supabase.co/functions/v1/send-telegram", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },
                body: JSON.stringify({ action: "give_reward", user_id: telegramId, reward_gems: 5, link_name: currentSlug })
            })
        ]);

        const rewardData = await rewardRes.json();

        if (rewardData.status === "success") {
            sessionStorage.setItem("dragon_reward_used", token);
            toast("تم إضافة عملة التنين بنجاح!", "success");
            if (statusBox) { statusBox.textContent = "✅ تم إضافة عملة التنين — تحقق من البوت"; statusBox.style.color = "var(--success)"; }
            setTimeout(() => {
                if (input && input.parentElement) input.parentElement.style.display = "none";
                if (rewardBtn) { rewardBtn.textContent = "تم الحصول على المكافأة"; rewardBtn.disabled = true; }
            }, 1500);
        } else {
            throw new Error("فشل إضافة الجواهر");
        }

    } catch (err) {
        console.error(err);
        toast("خطأ في الاتصال، حاول مرة أخرى", "error");
        if (input) input.disabled = false;
        if (rewardBtn) { rewardBtn.disabled = false; rewardBtn.style.opacity = "1"; rewardBtn.textContent = "تحقق واحصل على المكافأة"; }
        if (statusBox) statusBox.textContent = "";
    }
}
