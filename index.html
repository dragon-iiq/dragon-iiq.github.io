<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Dragon Toolkit - منصة متكاملة لأدوات العملات الرقمية.">
<meta name="author" content="Dragon">
<meta name="theme-color" content="#070b1d">
<title>Dragon Toolkit | أدوات العملات الرقمية</title>
<style>
/* ==================== RPG COLOR SYSTEM ==================== */
:root {
  --navy-900: #070b1d;
  --navy-800: #0d132b;
  --navy-700: #111a3d;
  --navy-600: #1a2347;
  
  --blue-core: #2563eb;
  --blue-glow: #3b82f6;
  --blue-light: #60a5fa;
  --purple-glow: #8b5cf6;
  --cyan-glow: #22d3ee;
  --gold: #f59e0b;
  --gold-light: #fbbf24;
  --success: #10b981;
  --danger: #f43f5e;
  
  --gradient-primary: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #8b5cf6 100%);
  --gradient-gold: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #fcd34d 100%);
  --gradient-cyan: linear-gradient(135deg, #22d3ee, #3b82f6);
  --gradient-glow: linear-gradient(135deg, rgba(37,99,235,0.15) 0%, rgba(139,92,246,0.12) 100%);
  --gradient-shimmer: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  
  --glass-bg: rgba(16, 22, 48, 0.6);
  --glass-border: rgba(96, 165, 250, 0.08);
  --glass-border-hover: rgba(96, 165, 250, 0.2);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.03);
  --glass-shadow-hover: 0 20px 40px rgba(0,0,0,0.4), 0 0 30px rgba(59,130,246,0.1);
  
  --text-glow-blue: 0 0 20px rgba(59,130,246,0.5);
  --text-glow-gold: 0 0 20px rgba(245,158,11,0.4);
  --box-glow-blue: 0 0 20px rgba(37,99,235,0.4), 0 0 40px rgba(59,130,246,0.2);
  --box-glow-purple: 0 0 20px rgba(139,92,246,0.3);

  --bg-primary: #070b1d;
  --bg-secondary: #0d132b;
  --bg-card: rgba(16, 22, 48, 0.6);
  --bg-glass: rgba(59, 130, 246, 0.04);
  --border-glass: rgba(96, 165, 250, 0.08);
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent-blue: #3b82f6;
  --accent-purple: #8b5cf6;
  --accent-cyan: #22d3ee;
  --accent-green: #10b981;
  --accent-red: #f43f5e;
  --accent-orange: #f59e0b;
  --accent-pink: #ec4899;
  --shadow-card: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.03);
  --radius: 20px;
  --radius-sm: 8px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Tahoma, Arial, sans-serif;
}

/* ==================== LIGHT MODE ==================== */
[data-theme="light"] {
  --bg-primary: #f0f4f8;
  --bg-secondary: #ffffff;
  --bg-card: rgba(255, 255, 255, 0.92);
  --bg-glass: rgba(37, 99, 235, 0.04);
  --border-glass: rgba(30, 64, 175, 0.08);
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --shadow-card: 0 8px 32px rgba(30, 58, 138, 0.1), 0 0 0 1px rgba(96, 165, 250, 0.12);
  --glass-bg: rgba(255, 255, 255, 0.85);
  --glass-border: rgba(30, 64, 175, 0.08);
  --glass-shadow: 0 8px 32px rgba(30, 58, 138, 0.08);
  --glass-shadow-hover: 0 20px 40px rgba(30, 58, 138, 0.15), 0 0 30px rgba(59,130,246,0.05);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-main);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  transition: var(--transition);
}

/* ==================== ANIMATED BACKGROUND ==================== */
.rpg-bg-orb {
  position: fixed;
  border-radius: 50%;
  opacity: 0.25;
  pointer-events: none;
  z-index: 0;
}
.orb-1 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, var(--blue-glow) 0%, transparent 70%);
  top: -10%; left: -10%;
  animation: orbFloat 20s ease-in-out infinite;
}
.orb-2 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, var(--purple-glow) 0%, transparent 70%);
  bottom: -10%; right: -10%;
  animation: orbFloat 20s ease-in-out infinite reverse;
}
.orb-3 {
  width: 300px; height: 300px;
  background: radial-gradient(circle, var(--cyan-glow) 0%, transparent 70%);
  top: 40%; left: 50%;
  animation: orbFloat 15s ease-in-out infinite 5s;
}
@keyframes orbFloat {
  0%, 100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(30px,-30px) scale(1.1); }
  66% { transform: translate(-20px,20px) scale(0.95); }
}

.rpg-grid-overlay {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image: 
    linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
  background-size: 50px 50px;
}

#particles-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 2; pointer-events: none;
}

/* ==================== GLASSMORPHISM PANELS ==================== */
.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: blur(8px) saturate(150%);
  -webkit-backdrop-filter: blur(8px) saturate(150%);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  box-shadow: var(--glass-shadow);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.glass-panel:hover {
  border-color: var(--glass-border-hover);
  box-shadow: var(--glass-shadow-hover);
}

/* ==================== GRADIENT TEXT EFFECTS ==================== */
.gradient-text {
  background: linear-gradient(135deg, #3b82f6, #8b5cf6, #22d3ee);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: hueRotate 8s linear infinite;
}
.gradient-text-gold {
  background: var(--gradient-gold);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
@keyframes hueRotate {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

/* ==================== GLOW EFFECTS ==================== */
.glow-blue { box-shadow: 0 0 20px rgba(37,99,235,0.4), 0 0 40px rgba(59,130,246,0.2); }
.glow-purple { box-shadow: 0 0 20px rgba(139,92,246,0.3); }
.glow-gold { box-shadow: 0 0 20px rgba(245,158,11,0.4); }
.text-glow-blue { text-shadow: 0 0 20px rgba(59,130,246,0.5); }

/* ==================== SHIMMER ==================== */
.shimmer {
  background: linear-gradient(90deg, #2563eb, #3b82f6, #60a5fa, #8b5cf6);
  background-size: 200% 100%;
  animation: shimmerMove 2s linear infinite;
}
@keyframes shimmerMove {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ==================== SCROLLBAR ==================== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--navy-900); }
::-webkit-scrollbar-thumb { background: var(--gradient-primary); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--gradient-cyan); }

/* ==================== APP ==================== */
#app { display: block; min-height: 100vh; }
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(7,11,29,0.8);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--glass-border);
  padding: 16px 24px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
}
[data-theme="light"] .header { background: rgba(240,244,248,0.85); }
.header-brand {
  display: flex; align-items: center; gap: 12px;
}
.header-brand .logo-box {
  width: 40px; height: 40px;
  background: var(--gradient-primary);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; color: white; font-size: 18px;
}
.header-brand span {
  font-size: 20px; font-weight: 800;
  background: var(--gradient-primary);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header-actions {
  display: flex; align-items: center; gap: 10px;
}
.icon-btn {
  width: 38px; height: 38px;
  background: var(--bg-glass);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-secondary);
  transition: var(--transition);
}
.icon-btn:hover {
  background: var(--glass-bg);
  color: var(--text-primary);
  border-color: var(--blue-core);
}
.icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
.main-content {
  padding: 24px;
  min-height: calc(100vh - 72px);
}
.tool-page {
  background: var(--glass-bg);
  backdrop-filter: blur(6px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 32px;
  max-width: 800px; margin: 0 auto;
}
.tool-page-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 28px;
}
.tool-page-header h2 { font-size: 22px; font-weight: 800; }
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block; font-size: 13px; font-weight: 600;
  color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 14px 16px;
  background: var(--bg-glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  color: var(--text-primary); font-size: 15px;
  font-family: var(--font-main); outline: none;
  transition: var(--transition);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--blue-core);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}
.form-group textarea { min-height: 120px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media(max-width:640px) { .form-row { grid-template-columns: 1fr; } }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 28px;
  background: var(--gradient-primary);
  border: none; border-radius: var(--radius-sm);
  color: white; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: var(--transition);
  position: relative; overflow: hidden;
}
.btn::after {
  content: ''; position: absolute; inset: 0;
  background: var(--gradient-shimmer);
  transform: translateX(-100%);
  transition: 0.7s;
}
.btn:hover::after { transform: translateX(100%); }
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4), 0 0 20px rgba(59, 130, 246, 0.15);
}
.btn-secondary {
  background: var(--bg-glass); color: var(--text-primary);
  border: 1px solid var(--glass-border);
}
.btn-secondary:hover { background: var(--glass-bg); }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
.result-box {
  margin-top: 20px; padding: 20px;
  background: var(--gradient-glow);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
}
.result-box .result-label {
  font-size: 12px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
}
.result-box .result-value {
  font-size: 28px; font-weight: 800;
  background: var(--gradient-primary);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.result-box .result-sub {
  font-size: 14px; color: var(--text-secondary); margin-top: 4px;
}
.toast-container {
  position: fixed; bottom: 24px; right: 24px; z-index: 9998;
  display: flex; flex-direction: column; gap: 10px;
}
.toast {
  background: var(--glass-bg);
  backdrop-filter: blur(8px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  padding: 14px 20px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: var(--glass-shadow);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  min-width: 280px;
  border-right: 3px solid var(--blue-glow);
}
.toast.success { border-right-color: var(--success); }
.toast.error { border-right-color: var(--danger); }
.toast.info { border-right-color: var(--blue-glow); }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }
@media(max-width:640px) {
  .tool-page { padding: 20px; }
}
[dir="rtl"] .toast-container { right: auto; left: 24px; }

.dragon-box { text-align: center; padding: 4px; }
.dragon-logo { width: 90px; height: 90px; margin: 0 auto 18px; }
.dragon-logo svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px var(--blue-glow)); }

/* ==================== DRAGON BUTTON STYLE ==================== */
.dragon-btn {
  width: 100%;
  padding: 18px 28px;
  background: #0a0a1a;
  border: 2px solid #1a2a6a;
  border-radius: var(--radius-sm);
  color: #7eb8ff;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  text-shadow: 0 0 10px rgba(59,130,246,0.3);
  box-shadow: 
    0 0 20px rgba(37,99,235,0.15),
    inset 0 0 30px rgba(37,99,235,0.05);
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(59,130,246,0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(59,130,246,0.05) 0%, transparent 40%),
    repeating-linear-gradient(
      45deg,
      transparent 0px,
      transparent 4px,
      rgba(37,99,235,0.03) 4px,
      rgba(37,99,235,0.03) 5px
    );
  letter-spacing: 2px;
}
.dragon-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(circle at 30% 20%, rgba(59,130,246,0.15) 0%, transparent 60%),
    radial-gradient(circle at 70% 80%, rgba(59,130,246,0.1) 0%, transparent 50%);
  pointer-events: none;
}
.dragon-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--gradient-shimmer);
  transform: translateX(-100%);
  transition: 0.7s;
}
.dragon-btn:hover {
  transform: translateY(-3px) scale(1.01);
  border-color: #3b82f6;
  box-shadow: 
    0 8px 32px rgba(37,99,235,0.4),
    0 0 40px rgba(37,99,235,0.15),
    inset 0 0 40px rgba(37,99,235,0.08);
  color: #93c5fd;
}
.dragon-btn:hover::after { transform: translateX(100%); }
.dragon-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

/* ==================== DRAGON REWARD INPUT ==================== */
.dragon-reward-input {
  width: 100%;
  padding: 14px 16px;
  background: #1a0e00;
  border: 2px solid #f59e0b;
  border-radius: var(--radius-sm);
  color: #fbbf24;
  font-size: 15px;
  font-family: var(--font-main);
  outline: none;
  transition: var(--transition);
  text-align: center;
  letter-spacing: 2px;
  font-weight: 700;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(245,158,11,0.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(245,158,11,0.08) 0%, transparent 40%),
    repeating-linear-gradient(
      45deg,
      transparent 0px,
      transparent 4px,
      rgba(245,158,11,0.04) 4px,
      rgba(245,158,11,0.04) 5px
    );
  box-shadow: 0 0 20px rgba(245,158,11,0.1);
}
.dragon-reward-input:focus {
  border-color: #fbbf24;
  box-shadow: 0 0 30px rgba(245,158,11,0.2), inset 0 0 20px rgba(245,158,11,0.05);
}
.dragon-reward-input::placeholder {
  color: rgba(245,158,11,0.4);
  letter-spacing: 2px;
}
.dragon-reward-input:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ==================== DRAGON REWARD BUTTON ==================== */
.dragon-reward-btn {
  width: 100%;
  padding: 16px 28px;
  background: #0a0a1a;
  border: 2px solid #1a2a6a;
  border-radius: var(--radius-sm);
  color: #7eb8ff;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  text-shadow: 0 0 10px rgba(59,130,246,0.3);
  box-shadow: 
    0 0 20px rgba(37,99,235,0.15),
    inset 0 0 30px rgba(37,99,235,0.05);
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(59,130,246,0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(59,130,246,0.05) 0%, transparent 40%),
    repeating-linear-gradient(
      45deg,
      transparent 0px,
      transparent 4px,
      rgba(37,99,235,0.03) 4px,
      rgba(37,99,235,0.03) 5px
    );
  letter-spacing: 1px;
  margin-top: 10px;
}
.dragon-reward-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(circle at 30% 20%, rgba(59,130,246,0.15) 0%, transparent 60%),
    radial-gradient(circle at 70% 80%, rgba(59,130,246,0.1) 0%, transparent 50%);
  pointer-events: none;
}
.dragon-reward-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--gradient-shimmer);
  transform: translateX(-100%);
  transition: 0.7s;
}
.dragon-reward-btn:hover {
  transform: translateY(-3px) scale(1.01);
  border-color: #3b82f6;
  box-shadow: 
    0 8px 32px rgba(37,99,235,0.4),
    0 0 40px rgba(37,99,235,0.15),
    inset 0 0 40px rgba(37,99,235,0.08);
  color: #93c5fd;
}
.dragon-reward-btn:hover::after { transform: translateX(100%); }
.dragon-reward-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.footer {
  border-top: 1px solid var(--glass-border);
  padding: 50px 28px 28px;
  margin-top: 60px;
  text-align: center;
  width: 100%;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}
.footer-links {
  display: flex; justify-content: center; gap: 28px;
  flex-wrap: wrap; margin-bottom: 24px;
}
.footer-links a {
  color: var(--text-secondary); text-decoration: none;
  font-size: 15px; font-weight: 600; transition: var(--transition); cursor: pointer;
}
.footer-links a:hover { color: var(--blue-glow); }
.footer-copy { color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>

<!-- ==================== ANIMATED BACKGROUND ==================== -->
<div class="rpg-bg-orb orb-1"></div>
<div class="rpg-bg-orb orb-2"></div>
<div class="rpg-bg-orb orb-3"></div>
<div class="rpg-grid-overlay"></div>
<canvas id="particles-canvas"></canvas>

<!-- ==================== APP ==================== -->
<div id="app">
<header class="header">
  <div class="header-brand">
    <div class="logo-box" style="background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #8b5cf6 100%); display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 122.88 106.68" width="24" height="24" style="filter: drop-shadow(0 0 4px rgba(59,130,246,0.5));">
        <defs>
          <linearGradient id="dragonCore2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#93c5fd"/>
            <stop offset="30%" stop-color="#60a5fa"/>
            <stop offset="65%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#1e40af"/>

// ==================== PARTICLES ANIMATION ====================
(function() {
  const canvas = document.getElementById('particles-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let particles = [];
  let w, h;
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  for (let i = 0; i < 25; i++) {
    particles.push({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 2 + 0.5,
      dx: (Math.random() - 0.5) * 0.3,
      dy: (Math.random() - 0.5) * 0.3,
      alpha: Math.random() * 0.5 + 0.1
    });
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0 || p.x > w) p.dx *= -1;
      if (p.y < 0 || p.y > h) p.dy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(59,130,246,' + p.alpha + ')';
      ctx.fill();
    });
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = 'rgba(59,130,246,' + (0.08 * (1 - dist/120)) + ')';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

function startCountdown() {
  clearCountdown();
  var widget = document.getElementById('countdownWidget');
  if (!widget) return;
  var circle = widget.querySelector('.cd-progress');
  var inner = widget.querySelector('.cd-inner');
  var circumference = 2 * Math.PI * 30;
  circle.style.strokeDasharray = circumference;
  circle.style.strokeDashoffset = 0;
  widget.classList.remove('ready');
  inner.onclick = null;
  var remaining = 5;
  inner.textContent = remaining;
  countdownTimer = setInterval(function() {
    remaining--;
    circle.style.strokeDashoffset = circumference * (1 - remaining / 5);
    if (remaining <= 0) {
      clearInterval(countdownTimer);
      widget.classList.add('ready');
      inner.textContent = 'اضغط هنا';
      inner.onclick = goToNextTool;
    } else {
      inner.textContent = remaining;
    }
  }, 1000);
}

function initDragonFingerprint() {
    if (dragonFpPromise) return dragonFpPromise;
    dragonFpPromise = new Promise(function(resolve) {
        loadFingerprintLibrary(function() {
            FingerprintJS.load()
                .then(fp => fp.get())

                    dragonFpId = result.visitorId;
                    sessionStorage.setItem(DRAGON_KEYS.FINGERPRINT, dragonFpId);
                    resolve(dragonFpId);

    });
    return dragonFpPromise;
}

}

                "apikey"        : SUPABASE_ANON_KEY,
                "Authorization" : `Bearer ${SUPABASE_ANON_KEY}`,
                "Content-Type"  : "application/json",
                "Prefer"        : "return=minimal"

            body: JSON.stringify({ session_value: sessionValue, device_fingerprint: fingerprintId, created_at: createdAt })

        return res.ok;
    } catch (err) {

            fetch(`${SUPABASE_URL}/rest/v1/token_id?id=eq.${rowId}`, {
                method: "DELETE",
                headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
            }),
            fetch("https://czbsrhxqoxcxjtigjnwl.supabase.co/functions/v1/send-telegram", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },
                body: JSON.stringify({ action: "give_reward", user_id: telegramId, reward_gems: 5, link_name: currentSlug })
            })
        ]);

        const rewardData = await rewardRes.json();

        if (rewardData.status === "success") {
            sessionStorage.setItem("dragon_reward_used", token);
            toast("تم إضافة عملة التنين بنجاح!", "success");
            if (statusBox) { statusBox.textContent = "✅ تم إضافة عملة التنين — تحقق من البوت"; statusBox.style.color = "var(--success)"; }
            setTimeout(() => {
                if (input && input.parentElement) input.parentElement.style.display = "none";
                if (rewardBtn) { rewardBtn.textContent = "تم الحصول على المكافأة"; rewardBtn.disabled = true; }
            }, 1500);
        } else {
            throw new Error("فشل إضافة الجواهر");
        }

    } catch (err) {
        console.error(err);
        toast("خطأ في الاتصال، حاول مرة أخرى", "error");
        if (input) input.disabled = false;
        if (rewardBtn) { rewardBtn.disabled = false; rewardBtn.style.opacity = "1"; rewardBtn.textContent = "تحقق واحصل على المكافأة"; }
        if (statusBox) statusBox.textContent = "";
    }
}

  const telegramId = urlParams.get("user_id") || "";
  if (telegramId) sessionStorage.setItem("telegram_user_id", telegramId);

  setTheme(currentTheme);
}

setTheme(currentTheme);
initApp();

    currentToolIndex = 0;
    if (document.readyState === 'complete') {
      openTool(toolOrder[0]);
    } else {

  });
});
